services:
  # Production container — build with: docker compose --profile prod up --build
  app:
    profiles: [prod]
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  # Development container — build with: docker compose --profile dev up --build
  app-dev:
    profiles: [dev]
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL 16 database — always available (no profile required)
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin — interface web para gerenciar o PostgreSQL
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8888:80"
    env_file: .env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
